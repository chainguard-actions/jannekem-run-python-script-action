name: Test error with fail-on-error false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure python is on PATH
        run: |
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/pybin"
            ln -sf "$(command -v python3)" "$RUNNER_TEMP/pybin/python"
            echo "$RUNNER_TEMP/pybin" >> "$GITHUB_PATH"
          fi
      - id: action
        uses: .
        with:
          fail-on-error: "false"
          script: |
            print("before failure")
            raise RuntimeError("boom-error")
      - name: Assert error reported but step succeeded
        env:
          ERR: ${{ steps.action.outputs.error }}
          STDOUT: ${{ steps.action.outputs.stdout }}
          STDERR: ${{ steps.action.outputs.stderr }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "error: $ERR"; echo "outcome: $OUTCOME"
          echo "stdout: $STDOUT"; echo "stderr: $STDERR"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected step success"; exit 1
          fi
          if [ "$ERR" != "true" ]; then
            echo "FAIL: expected error=true"; exit 1
          fi
          if ! echo "$STDOUT" | grep -q "before failure"; then
            echo "FAIL: stdout missing"; exit 1
          fi
          if ! echo "$STDERR" | grep -q "boom-error"; then
            echo "FAIL: stderr missing traceback"; exit 1
          fi
          echo "PASS"
