name: Test util disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure python is on PATH
        run: |
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/pybin"
            ln -sf "$(command -v python3)" "$RUNNER_TEMP/pybin/python"
            echo "$RUNNER_TEMP/pybin" >> "$GITHUB_PATH"
          fi
      - id: action
        uses: .
        with:
          util: "false"
          script: |
            print("has_set_output=" + str("set_output" in globals()))
      - name: Assert util functions absent
        env:
          STDOUT: ${{ steps.action.outputs.stdout }}
          ERR: ${{ steps.action.outputs.error }}
        run: |
          echo "stdout: $STDOUT"
          if ! echo "$STDOUT" | grep -q "has_set_output=False"; then
            echo "FAIL: util functions should not be included"; exit 1
          fi
          if [ "$ERR" != "false" ]; then
            echo "FAIL: expected error=false"; exit 1
          fi
          echo "PASS"
