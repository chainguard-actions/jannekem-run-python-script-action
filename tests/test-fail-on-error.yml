name: Test fail-on-error default (true)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure a 'python' executable is on PATH
        run: |
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$HOME/pybin"
            ln -sf "$(command -v python3)" "$HOME/pybin/python"
            echo "$HOME/pybin" >> "$GITHUB_PATH"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          script: |
            import sys
            print("about to exit", file=sys.stderr)
            sys.exit(3)
      - name: Assert step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STDERR: ${{ steps.action.outputs.stderr }}
          ERR: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "stderr: $STDERR"
          echo "error: $ERR"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step failure"; exit 1
          fi
          if [ "$ERR" != "true" ]; then
            echo "FAIL: expected error=true"; exit 1
          fi
          if ! echo "$STDERR" | grep -q "about to exit"; then
            echo "FAIL: stderr not captured"; exit 1
          fi
          echo "PASS"
