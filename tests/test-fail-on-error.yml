name: Test fail-on-error default fails step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure a `python` executable is on PATH
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
            $SUDO apt-get update && $SUDO apt-get install -y python3
          fi
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$HOME/pybin"
            ln -sf "$(command -v python3)" "$HOME/pybin/python"
            echo "$HOME/pybin" >> "$GITHUB_PATH"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          script: |
            import sys
            print("about to exit")
            sys.exit(3)
      - name: Assert step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERR: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "error: $ERR"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail with default fail-on-error"
            exit 1
          fi
          if [ -n "$ERR" ] && [ "$ERR" != "true" ]; then
            echo "FAIL: expected error=true when set"
            exit 1
          fi
          echo "PASS"
